name: Build and Push Nginx Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set image tags
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/cats-hub:latest -t ${{ secrets.DOCKERHUB_USERNAME }}/cats-hub:${{ steps.vars.outputs.sha_short }} .
          ${{ secrets.DOCKERHUB_USERNAME }}/cats-hub:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/cats-hub:${{ steps.vars.outputs.sha_short }}
            
