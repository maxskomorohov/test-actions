<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nginx Cat Server - V2</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            text-align: center;
        }

        .banner {
            background: #ff0055;
            padding: 20px;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 2px;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { background-color: #ff0055; }
            50% { background-color: #ffcc00; }
            100% { background-color: #ff0055; }
        }

        h1 {
            margin-top: 20px;
            font-size: 28px;
        }

        .subtitle {
            opacity: 0.8;
        }

        .cats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 30px;
        }

        .cat-card {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 15px;
            overflow: hidden;
            transform: scale(1);
            transition: transform 0.3s ease;
        }

        .cat-card:hover {
            transform: scale(1.05);
        }

        .cat-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .label {
            padding: 10px;
            font-weight: bold;
        }

        .footer {
            margin: 20px;
            opacity: 0.7;
        }

        .badge {
            display: inline-block;
            margin-top: 10px;
            padding: 5px 10px;
            background: #22c55e;
            border-radius: 20px;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="banner">
        🚀 NGiNX CAT SERVER v2 🚀
    </div>

    <h1>Welcome to Cats Reloaded</h1>
    <p class="subtitle">If you notice this instantly → deployment works</p>

    <div class="badge">VERSION 2 ACTIVE</div>

    <div class="cats">
        <div class="cat-card">
            <img src="https://cataas.com/cat?1" alt="Cat 1">
            <div class="label">Ultra Cat #1</div>
        </div>

        <div class="cat-card">
            <img src="https://cataas.com/cat?2" alt="Cat 2">
            <div class="label">Mega Cat #2</div>
        </div>

        <div class="cat-card">
            <img src="https://cataas.com/cat?3" alt="Cat 3">
            <div class="label">Hyper Cat #3</div>
        </div>
    </div>

    <div class="footer">
        ⚡ Served by Nginx • Now with more chaos ⚡
    </div>

</body>
</html>
